name: Dependency security audit

on:
  push:
    paths:
      - requirements.txt
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - requirements.txt
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Check locked dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
