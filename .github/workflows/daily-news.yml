name: Daily news digest

on:
  schedule:
    # A single daily GitHub schedule was delayed by 5-8 hours. Frequent actual
    # runs both keep the free Render service awake and make the delivery window
    # independent of any one delayed event. The server prevents duplicates.
    # Offset from round clock boundaries, where GitHub reports the heaviest
    # scheduled-workflow load: 03, 13, 23, 33, 43 and 53 each hour.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      send_digest:
        description: Send the protected digest after the health check
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-news-digest
  cancel-in-progress: false

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render and verify health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 90 \
            https://new-bot-ig34.onrender.com/health

      - name: Trigger digest once in the Almaty morning window
        shell: bash
        env:
          DAILY_CRON_SECRET: ${{ secrets.DAILY_CRON_SECRET }}
          DIGEST_URL: https://new-bot-ig34.onrender.com/cron/daily
        run: |
          local_time="$(TZ=Asia/Almaty date +%H:%M)"
          hour="${local_time%:*}"
          minute="${local_time#*:}"
          total=$((10#$hour * 60 + 10#$minute))
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             [[ "${{ inputs.send_digest }}" != "true" ]]; then
            echo "Manual health check complete; digest was not requested"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]] && \
             (( total < 600 || total >= 630 )); then
            echo "Health check complete; no digest at ${local_time} Asia/Almaty"
            exit 0
          fi
          test -n "$DAILY_CRON_SECRET"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 20 \
            --max-time 120 \
            --request POST \
            --header "X-Cron-Secret: $DAILY_CRON_SECRET" \
            "$DIGEST_URL"
