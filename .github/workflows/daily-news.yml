name: Daily news digest

on:
  schedule:
    # GitHub schedules are UTC by default. Use an explicit Almaty timezone and
    # an off-peak minute; GitHub warns that high-load periods can delay runs.
    - cron: "7 10 * * *"
      timezone: "Asia/Almaty"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news-digest
  cancel-in-progress: false

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait until 10:00 Almaty
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          local_time="$(TZ=Asia/Almaty date +%H:%M)"
          hour="${local_time%:*}"
          minute="${local_time#*:}"
          total=$((10#$hour * 60 + 10#$minute))
          # A delayed GitHub schedule must never create a 17:00+ digest.
          if (( total < 600 || total >= 660 )); then
            echo "Skipping delayed schedule at ${local_time} Asia/Almaty"
            exit 0
          fi

      - name: Trigger protected digest endpoint
        env:
          DAILY_CRON_SECRET: ${{ secrets.DAILY_CRON_SECRET }}
          DIGEST_URL: https://new-bot-ig34.onrender.com/cron/daily
        run: |
          test -n "$DAILY_CRON_SECRET"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 20 \
            --max-time 120 \
            --request POST \
            --header "X-Cron-Secret: $DAILY_CRON_SECRET" \
            "$DIGEST_URL"
