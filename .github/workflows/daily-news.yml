name: Daily news digest

on:
  schedule:
    # Start shortly before the top-of-hour Actions peak, then wait until
    # 05:00 UTC (10:00 Asia/Almaty) before triggering the digest.
    - cron: "57 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news-digest
  cancel-in-progress: false

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait until 10:00 Almaty
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          now="$(date -u +%s)"
          target="$(date -u -d 'today 05:00:00' +%s)"
          if (( now < target )); then
            sleep "$((target - now))"
          fi

      - name: Trigger protected digest endpoint
        env:
          DAILY_CRON_SECRET: ${{ secrets.DAILY_CRON_SECRET }}
          DIGEST_URL: https://new-bot-ig34.onrender.com/cron/daily
        run: |
          test -n "$DAILY_CRON_SECRET"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 20 \
            --max-time 120 \
            --request POST \
            --header "X-Cron-Secret: $DAILY_CRON_SECRET" \
            "$DIGEST_URL"
